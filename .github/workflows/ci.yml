name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.14.0
          - os: macos-latest
            node-version: 22.14.0
          - os: windows-latest
            node-version: 24

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci
      - run: npm run verify:native
      - if: runner.os == 'Linux'
        run: npm run verify:wasm
        env:
          TREE_SITTER_WASM_DOCKER: "1"
      - if: runner.os == 'Linux'
        run: npm pack --dry-run
        env:
          TREE_SITTER_WASM_DOCKER: "1"
