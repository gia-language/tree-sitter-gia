name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22"
          - os: macos-latest
            node-version: "22"
          - os: windows-2022
            node-version: "22"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - run: npm ci
      - run: node --test scripts/check-release.test.mjs
      - run: npm run verify:native
      - if: runner.os == 'Linux'
        run: npm run verify:wasm
        env:
          TREE_SITTER_WASM_DOCKER: "1"
      - if: runner.os == 'Linux'
        run: npm pack --dry-run
        env:
          TREE_SITTER_WASM_DOCKER: "1"
